services:
  db:
    image: postgres:16
    container_name: financial_journeys_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: financial_journeys
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: change_me_local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
